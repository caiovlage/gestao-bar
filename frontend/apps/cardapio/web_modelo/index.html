<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- Celular primeiro: largura do aparelho, área segura do notch, zoom permitido (acessibilidade) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4EEE3">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Entre Nós">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Entre Nós · Bar de Piscina & Bistrô. Peça pelo celular e receba no seu apartamento.">
  <!-- Prévia ao colar o link (WhatsApp, Instagram, Facebook, Telegram…). O nginx troca __ORIGEM__
       pelo endereço do servidor (ex.: http://204.216.142.240), pois a imagem precisa de URL completa. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Entre Nós">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Entre Nós · Cardápio">
  <meta property="og:description" content="Bar de Piscina & Bistrô — alma carioca, coração de bistrô. Peça pelo celular e receba no seu apartamento.">
  <meta property="og:url" content="__ORIGEM__/cardapio/">
  <meta property="og:image" content="__ORIGEM__/cardapio/og-entre-nos-v2.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo Entre Nós · Bar de Piscina & Bistrô · Cardápio digital">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Entre Nós · Cardápio">
  <meta name="twitter:description" content="Peça pelo celular e receba no seu apartamento.">
  <meta name="twitter:image" content="__ORIGEM__/cardapio/og-entre-nos-v2.jpg">
  <title>Entre Nós · Cardápio</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F4EEE3; }
    /* Tela de carregamento: aparece na hora, enquanto o app é baixado */
    #carregando {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1C2B23; background: #F4EEE3; text-align: center; transition: opacity .3s;
    }
    #carregando .logo { width: 240px; max-width: 70vw; height: auto; }
    #carregando .roda {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid #E0D3BC; border-top-color: #123F2D;
      animation: girar .8s linear infinite;
    }
    #carregando .titulo { font-family: Georgia, "Times New Roman", serif; font-size: 26px; color: #123F2D; }
    #carregando p { margin: 0; font-size: 15px; color: #6F6A5D; max-width: 320px; line-height: 1.5; }
    #carregando-erro { display: none; }
    #carregando button {
      margin-top: 8px; padding: 12px 22px; border-radius: 14px; border: 0;
      background: #123F2D; color: #F4EEE3; font-size: 15px; font-weight: 700;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="carregando">
    <img class="logo" src="assets/packages/core/assets/marca/logo-entre-nos.png" alt="Entre Nós" width="240">
    <div class="roda" id="carregando-roda"></div>
    <p id="carregando-msg">Carregando o cardápio…</p>
    <div id="carregando-erro">
      <p>Não conseguimos abrir o cardápio. Verifique a internet do celular e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('carregando');
      var msg = document.getElementById('carregando-msg');
      function mostrarErro() {
        if (!el || !el.parentNode) return;
        etapas.forEach(clearTimeout);
        document.getElementById('carregando-roda').style.display = 'none';
        msg.style.display = 'none';
        document.getElementById('carregando-erro').style.display = 'block';
      }
      var etapas = [
        setTimeout(function () { msg.textContent = 'Quase lá… preparando o cardápio'; }, 4000),
        setTimeout(function () { msg.textContent = 'Sua conexão parece lenta. Ainda carregando…'; }, 10000),
        setTimeout(function () {
          document.getElementById('carregando-roda').style.display = 'none';
          msg.style.display = 'none';
          document.getElementById('carregando-erro').style.display = 'block';
        }, 30000)
      ];
      // Chamado pelo app assim que desenha a primeira tela (e pelo evento do Flutter, se houver).
      window.removerCarregando = function () {
        etapas.forEach(clearTimeout);
        if (!el || !el.parentNode) return;
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
      };
      window.addEventListener('flutter-first-frame', window.removerCarregando);
      // Erro ao carregar o app (ex.: arquivo do motor gráfico recusado): avisa logo, com "Tentar novamente".
      window.addEventListener('unhandledrejection', function (e) {
        var motivo = String(e.reason && (e.reason.message || e.reason));
        if (!/WebAssembly|wasm|canvaskit|main\.dart|Failed to fetch|NetworkError|Loading/i.test(motivo)) return;
        console.error('Falha ao iniciar o cardápio:', e.reason);
        mostrarErro();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
