<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- Celular primeiro: largura do aparelho, área segura do notch, zoom permitido (acessibilidade) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0C0A">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cardápio">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Cardápio digital: faça seu pedido pelo celular.">
  <title>Cardápio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0E0C0A; }
    /* Tela de carregamento: aparece na hora, enquanto o app é baixado */
    #carregando {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F4EDE2; background: #0E0C0A; text-align: center; transition: opacity .3s;
    }
    #carregando .roda {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid #2F2822; border-top-color: #D4AF6A;
      animation: girar .8s linear infinite;
    }
    #carregando .titulo { font-family: Georgia, "Times New Roman", serif; font-size: 22px; color: #F4EDE2; }
    #carregando p { margin: 0; font-size: 15px; color: #A89C8C; max-width: 320px; line-height: 1.5; }
    #carregando-erro { display: none; }
    #carregando button {
      margin-top: 8px; padding: 12px 22px; border-radius: 14px; border: 0;
      background: #D4AF6A; color: #0E0C0A; font-size: 15px; font-weight: 700;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="carregando">
    <div class="roda" id="carregando-roda"></div>
    <div class="titulo">Cardápio</div>
    <p id="carregando-msg">Carregando o cardápio…</p>
    <div id="carregando-erro">
      <p>Não conseguimos abrir o cardápio. Verifique a internet do celular e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('carregando');
      var msg = document.getElementById('carregando-msg');
      var etapas = [
        setTimeout(function () { msg.textContent = 'Quase lá… preparando o cardápio'; }, 4000),
        setTimeout(function () { msg.textContent = 'Sua conexão parece lenta. Ainda carregando…'; }, 10000),
        setTimeout(function () {
          document.getElementById('carregando-roda').style.display = 'none';
          msg.style.display = 'none';
          document.getElementById('carregando-erro').style.display = 'block';
        }, 30000)
      ];
      // Chamado pelo app assim que desenha a primeira tela (e pelo evento do Flutter, se houver).
      window.removerCarregando = function () {
        etapas.forEach(clearTimeout);
        if (!el || !el.parentNode) return;
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
      };
      window.addEventListener('flutter-first-frame', window.removerCarregando);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
