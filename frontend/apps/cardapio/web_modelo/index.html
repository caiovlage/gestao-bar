<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <!-- Celular primeiro: largura do aparelho, área segura do notch, zoom permitido (acessibilidade) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0C0A">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cardápio">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Cardápio digital: faça seu pedido pelo celular.">
  <title>Cardápio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0E0C0A; }
    /* Tela de carregamento: aparece na hora, enquanto o app (alguns MB) é baixado */
    #carregando {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F5F0E8; transition: opacity .25s;
    }
    #carregando .roda {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid #2F2822; border-top-color: #D4AF6A;
      animation: girar .8s linear infinite;
    }
    #carregando p { margin: 0; font-size: 16px; color: #A89C8C; }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="carregando">
    <div class="roda"></div>
    <p>Carregando cardápio…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
