name: core
description: Código compartilhado entre os apps do bar (cliente da API, tema, widgets, formatação).
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  # Logo "Entre Nós" (arte original, fundo transparente) e Playfair Display (SIL OFL)
  assets:
    - assets/marca/
  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
