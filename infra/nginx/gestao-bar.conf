# Gestão do Bar — nginx instalado no servidor (Oracle Linux).
# Instalar em: /etc/nginx/conf.d/gestao-bar.conf
#
#   http://servidor/         → redireciona para o cardápio do cliente
#   http://servidor/admin/   → painel Flutter (arquivos em /var/www/gestao-bar/admin)
#   http://servidor/cardapio/ → cardápio digital do cliente (QR Code das mesas)
#   http://servidor/api/     → backend Spring Boot (Docker, 127.0.0.1:8080)

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Ao usar um domínio (necessário para HTTPS), descomente e ajuste:
    # server_name bar.exemplo.com.br;

    server_tokens off;
    client_max_body_size 10m;   # upload de imagens de produtos (limite da API: 5 MB)

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    root /var/www/gestao-bar;

    # ----------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ----------------------------------------------------------------- painel
    location /admin/ {
        # Rotas do app (ex.: /admin/produtos/123) caem no index.html do Flutter.
        try_files $uri $uri/ /admin/index.html;
        # Os arquivos do Flutter Web não têm hash no nome: o navegador revalida a cada acesso
        # (resposta 304 quando não mudou), garantindo a versão nova após cada atualização.
        add_header Cache-Control "no-cache";
    }

    location = /admin { return 301 /admin/; }

    # ----------------------------------------------------------------- cardápio digital (cliente)
    location /cardapio/ {
        try_files $uri $uri/ /cardapio/index.html;
        add_header Cache-Control "no-cache";
        # Prévia de link (WhatsApp etc.): a imagem precisa de endereço completo; o nginx preenche.
        sub_filter '__ORIGEM__' '$scheme://$host';
        sub_filter_once off;
    }

    location = /cardapio { return 301 /cardapio/; }

    # ----------------------------------------------------------------- WebAssembly
    # O mime.types do nginx do Oracle Linux não conhece .wasm; sem "application/wasm"
    # o navegador recusa o motor gráfico do Flutter e o app não abre.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    # Endereço principal abre o cardápio (o link que o cliente recebe); o painel fica em /admin/
    location = / { return 302 /cardapio/; }
}
