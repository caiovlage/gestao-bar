# Gestão do Bar — protocolo público (instalado em /etc/nginx/conf.d/gestao-bar-mapa.conf).
# Com Cloudflare (ou outro proxy com HTTPS) na frente, o nginx recebe em http; o proxy informa
# o protocolo original em X-Forwarded-Proto. Usado para montar endereços absolutos (prévia de link).
map $http_x_forwarded_proto $esquema_publico {
    default $scheme;
    https   https;
}
